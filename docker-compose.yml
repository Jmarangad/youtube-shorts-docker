services:
  trending-agent:
    build: ./trending-agent
    image: youtube-trending-agent:latest
    container_name: youtube-trending-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - reports:/reports

  downloader:
    build: ./downloader
    image: youtube-shorts-downloader:latest
    container_name: youtube-shorts-downloader
    restart: unless-stopped
    depends_on:
      - trending-agent
    environment:
      - TZ=Asia/Kolkata
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
    volumes:
      - reports:/reports
      - downloads:/downloads
      - whisper-cache:/root/.cache/whisper

  dubber:
    build: ./dubber
    image: youtube-shorts-dubber:latest
    container_name: youtube-shorts-dubber
    restart: unless-stopped
    depends_on:
      - downloader
    environment:
      - TZ=Asia/Kolkata
      - WHISPER_MODEL=${DUB_WHISPER_MODEL:-base}
      - DUB_VOICE=${DUB_VOICE:-hi-IN-MadhurNeural}
    volumes:
      - downloads:/downloads
      - dubbed:/dubbed
      - whisper-cache:/root/.cache/whisper

  uploader:
    build: ./uploader
    image: youtube-shorts-uploader:latest
    container_name: youtube-shorts-uploader
    restart: unless-stopped
    depends_on:
      - dubber
    environment:
      - TZ=Asia/Kolkata
      - YT_PRIVACY=${YT_PRIVACY:-unlisted}
    volumes:
      - dubbed:/dubbed
      - reports:/reports:ro
      - downloads:/downloads:ro
      - uploader-config:/config

  dashboard:
    build: ./dashboard
    image: youtube-shorts-dashboard:latest
    container_name: youtube-shorts-dashboard
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "8080:80"
    volumes:
      - reports:/reports:ro
      - downloads:/downloads:ro
      - dubbed:/dubbed:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  reports:
  downloads:
  whisper-cache:
  dubbed:
  uploader-config:
