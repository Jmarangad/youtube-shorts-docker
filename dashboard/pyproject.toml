[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-dashboard"
version = "1.0.0"
description = "Web dashboard showing execution, status and activity of the Shorts pipeline agents."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "docker>=7.0",
]

[tool.setuptools.packages.find]
include = ["dashboard*"]

[project.scripts]
youtube-shorts-dashboard = "dashboard.app:main"